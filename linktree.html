<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Backlane Drops</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b0b0d;
      --bg-soft: #141417;
      --card: #16161a;
      --line: rgba(255, 255, 255, .08);
      --gold: #c9a961;
      --gold-light: #e8d5a3;
      --text: #f4f1ea;
      --muted: #8f8b82;
    }

    html, body { min-height: 100%; }

    body {
      font-family: 'Inter', sans-serif;
      color: var(--text);
      background:
        radial-gradient(900px 500px at 50% -10%, rgba(201, 169, 97, .16), transparent 60%),
        radial-gradient(600px 400px at 100% 100%, rgba(201, 169, 97, .07), transparent 60%),
        var(--bg);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
    }

    .page { max-width: 580px; padding: 56px 20px 40px; }

    /* ---------- Profile ---------- */
    .avatar-ring {
      width: 132px; height: 132px;
      margin: 0 auto 26px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, var(--gold-light), var(--gold) 45%, #6e5a2c);
      box-shadow: 0 0 0 8px rgba(201, 169, 97, .06), 0 20px 50px rgba(0, 0, 0, .5);
    }
    .avatar {
      width: 100%; height: 100%;
      border-radius: 50%;
      background: var(--bg-soft) center/cover no-repeat;
      /* Replace with your photo:  background-image: url('your-photo.jpg'); */
      display: flex; align-items: center; justify-content: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: 3rem; font-weight: 600;
      color: var(--gold);
      letter-spacing: .04em;
    }

    .name {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      font-size: clamp(2.4rem, 7vw, 3.1rem);
      letter-spacing: .02em;
      line-height: 1.05;
      margin-bottom: 10px;
    }
    .tagline {
      color: var(--muted);
      font-weight: 300;
      letter-spacing: .28em;
      text-transform: uppercase;
      font-size: .72rem;
      margin-bottom: 18px;
    }
    .divider {
      display: flex; align-items: center; justify-content: center; gap: 14px;
      margin: 0 auto 18px; max-width: 220px;
      color: var(--gold);
    }
    .divider::before, .divider::after {
      content: ""; flex: 1; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold));
    }
    .divider::after { transform: scaleX(-1); }
    .divider i { font-size: .6rem; }

    .bio {
      color: #bdb8ad;
      font-weight: 300;
      font-size: .98rem;
      line-height: 1.7;
      max-width: 420px;
      margin: 0 auto 38px;
    }

    /* ---------- Social cards ---------- */
    .social-list { display: flex; flex-direction: column; gap: 16px; }

    .social {
      position: relative;
      display: flex; align-items: center; gap: 20px;
      padding: 20px 24px;
      min-height: 96px;
      background: linear-gradient(180deg, var(--card), #111114);
      border: 1px solid var(--line);
      border-radius: 20px;
      text-decoration: none;
      color: var(--text);
      overflow: hidden;
      transition: transform .35s cubic-bezier(.2, .8, .2, 1), border-color .35s, box-shadow .35s;
      opacity: 0;
      transform: translateY(14px);
      animation: rise .7s cubic-bezier(.2, .8, .2, 1) forwards;
    }
    .social:nth-child(1) { animation-delay: .10s; }
    .social:nth-child(2) { animation-delay: .18s; }
    .social:nth-child(3) { animation-delay: .26s; }
    .social:nth-child(4) { animation-delay: .34s; }
    .social:nth-child(5) { animation-delay: .42s; }
    .social:nth-child(6) { animation-delay: .50s; }
    .social:nth-child(7) { animation-delay: .58s; }

    @keyframes rise { to { opacity: 1; transform: translateY(0); } }

    .social::before {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(110deg, transparent 30%, rgba(201, 169, 97, .12) 50%, transparent 70%);
      transform: translateX(-120%);
      transition: transform .8s ease;
    }
    .social:hover {
      color: var(--text);
      transform: translateY(-4px);
      border-color: rgba(201, 169, 97, .55);
      box-shadow: 0 18px 40px rgba(0, 0, 0, .55), 0 0 0 1px rgba(201, 169, 97, .15);
    }
    .social:hover::before { transform: translateX(120%); }

    .icon-box {
      flex: 0 0 auto;
      width: 62px; height: 62px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.9rem;
      color: var(--gold-light);
      background: radial-gradient(circle at 30% 25%, rgba(201, 169, 97, .22), rgba(201, 169, 97, .04));
      border: 1px solid rgba(201, 169, 97, .35);
      transition: background .35s, color .35s, transform .35s;
    }
    .social:hover .icon-box {
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
      color: #14110a;
      transform: scale(1.06) rotate(-4deg);
    }

    .social-text { flex: 1 1 auto; min-width: 0; }
    .social-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.65rem; font-weight: 600;
      line-height: 1.1;
      letter-spacing: .01em;
    }
    .social-handle {
      color: var(--muted);
      font-size: .85rem; font-weight: 300;
      letter-spacing: .04em;
      margin-top: 4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .arrow {
      flex: 0 0 auto;
      color: var(--gold);
      font-size: 1.25rem;
      opacity: .6;
      transition: transform .35s, opacity .35s;
    }
    .social:hover .arrow { transform: translateX(5px); opacity: 1; }

    /* ---------- Footer ---------- */
    .footer {
      margin-top: 44px;
      text-align: center;
      color: #5f5c55;
      font-size: .72rem;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    @media (max-width: 400px) {
      .social { padding: 16px 18px; gap: 16px; min-height: 88px; }
      .icon-box { width: 54px; height: 54px; font-size: 1.6rem; }
      .social-title { font-size: 1.45rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .social { animation: none; opacity: 1; transform: none; }
      * { transition: none !important; }
    }
  </style>
</head>
<body>

  <main class="container page">

    <!-- Profile -->
    <header class="text-center">
      <div class="avatar-ring">
        <div class="avatar" role="img" aria-label="Profile photo">BD</div>
      </div>
      <h1 class="name">Backlane Drops</h1>
      <div class="divider"><i class="bi bi-diamond-fill"></i></div>
      <p class="bio">
        Welcome. Use our links, you're covered.
      </p>
    </header>

    <!-- Socials: replace each href and handle with your own -->
    <nav class="social-list" aria-label="Social links">
 

      <a class="social" href="https://wa.me/447476502796" target="_blank" rel="noopener">
        <span class="icon-box"><i class="bi bi-whatsapp"></i></span>
        <span class="social-text">
          <div class="social-title">WhatsApp</div>
          <div class="social-handle">Message me directly</div>
        </span>
        <i class="bi bi-arrow-right arrow"></i>
      </a>

      <a class="social" href="https://t.me/yardmanzee" target="_blank" rel="noopener">
        <span class="icon-box"><i class="bi bi-telegram"></i></span>
        <span class="social-text">
          <div class="social-title">Telegram</div>
          <div class="social-handle">@yardmanzee</div>
        </span>
        <i class="bi bi-arrow-right arrow"></i>
      </a>

    </nav>

    <footer class="footer">&copy; <span id="year"></span> Backlane Drops</footer>

  </main>
  
</body>
</html>
